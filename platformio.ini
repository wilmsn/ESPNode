; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; core_dirs = /tmp
build_dir = /tmp/pio

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.filesystem = littlefs
lib_ldf_mode = chain
build_flags=-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
;lib_deps =
;	ArduinoJson@^6.18.5
;	AsyncTCP@^1.1.1
;    esp32async/ESPAsyncTCP@^2.0.0
;    adafruit/Adafruit GC9A01A@^1.1.0
;	adafruit/Adafruit GFX Library@^1.12.4
;    ayushsharma82/ElegantOTA@^3.1.7
;	https://github.com/adafruit/Adafruit_BusIO.git
;	igorantolic/Ai Esp32 Rotary Encoder@^1.7
;	https://github.com/wilmsn/LED_Matrix.git
;	https://github.com/wilmsn/BMX_sensor.git
;	knolleary/PubSubClient@^2.8
;	https://github.com/wilmsn/Preferences8266.git
;	https://github.com/wilmsn/Uptime.git
;   https://github.com/wilmsn/SimpleFTPServer.git
	

lib_ignore = AsyncTCP_RP2040W

[env:ESP8266]
platform = espressif8266
board = esp12e
;build_flags = 	-Teagle.flash.2m.ld
;lib_ignore = ESP32-audioI2S, AsyncTCP, RPAsyncTCP, AsyncTCP_RP2040W, FtpServer, TJpg_Decoder, ESP8266WebServer
lib_ignore = ESP32-audioI2S, AsyncTCP, RPAsyncTCP, AsyncTCP_RP2040W, SDFS, SD, TJpg_Decoder
monitor_port = /dev/ttyUSB0
;lib_deps =
;	https://github.com/ayushsharma82/ElegantOTA.git

[env:ESP01_1MB_FS_128]
platform = espressif8266
board = esp01_1m
board_build.ldscript = eagle.flash.1m128.ld
lib_ignore = ESP32-audioI2S, AsyncTCP, RPAsyncTCP, AsyncTCP_RP2040W, FtpServer, TJpg_Decoder, SDFS, SD
monitor_port = /dev/ttyUSB0

[env:ESP01_1MB_FS_64]
platform = espressif8266
board = esp01_1m
board_build.ldscript = eagle.flash.1m64.ld
lib_ignore = ESP32-audioI2S, AsyncTCP, RPAsyncTCP, AsyncTCP_RP2040W, FtpServer, TJpg_Decoder, SDFS, SD
monitor_port = /dev/ttyUSB0

[env:esp-wrover-kit]
platform = espressif32
board = esp-wrover-kit
board_build.partitions = partitions_minimal_spiffs.csv

[env:esp32-4MB]
platform = espressif32
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32dev
board_build.partitions = partitions_minimal_spiffs.csv
lib_ignore = ESP8266Audio, ESPAsyncTCP, RPAsyncTCP, AsyncTCP_RP2040W
;build_flags = -I./lib/TJpg_Decoder/src/ -DBOARD_HAS_PSRAM -DCORE_DEBUG_LEVEL=1
build_flags = -DCORE_DEBUG_LEVEL=1

[env:esp32-16M]
;platform = espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
	-Os
	-DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
lib_ignore = ESP8266Audio, ESPAsyncTCP, RPAsyncTCP, AsyncTCP_RP2040W

[env:ESP32S3]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
;platform = espressif32
;platform = espressif32 @ 6.10.0
board = esp32-s3-devkitc-1
;framework = arduino
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM
;build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM
;monitor_port = /dev/ttyACM0
;monitor_speed = 115200
;monitor_rts = 0
;monitor_dtr = 0
board_build.flash_mode = qio
lib_ignore = ESP8266Audio, ESPAsyncTCP, RPAsyncTCP, AsyncTCP_RP2040W

[env:ESP32S3_N8R2]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.arduino.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_ram_size = 81920
board_upload.maximum_size = 8388608
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM
lib_ignore = ESP8266Audio, ESPAsyncTCP, RPAsyncTCP, AsyncTCP_RP2040W

[env:ESP32S3_N16R8]
framework = arduino
;platform = espressif32 @ 6.12.0
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
;board = esp32-s3-devkitm-1
board = esp32-s3-devkitc1-n16r8
board_build.arduino.memory_type = dio_opi
board_build.arduino.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_ram_size = 327680
board_upload.maximum_size = 16777216
lib_deps =
;    https://github.com/wilmsn/ESP32-audioI2S.git
   https://github.com/wilmsn/SdFat.git
lib_ignore = ESP8266Audio, ESPAsyncTCP, RPAsyncTCP, AsyncTCP_RP2040W
;, Sqlite3Esp32
;build_flags = -I./lib/TJpg_Decoder/src/ -DBOARD_HAS_PSRAM -DCORE_DEBUG_LEVEL=1
build_flags = 
    -I/home/norbert/.platformio/packages/framework-arduinoespressif32-libs/esp32s3/include/fatfs/src/
	-I/home/norbert/.platformio/packages/framework-arduinoespressif32-libs/esp32s3/include/fatfs/vfs/
	-I/home/norbert/.platformio/packages/framework-arduinoespressif32-libs/esp32s3/include/fatfs/diskio/
	-DBOARD_HAS_PSRAM 
	-DCORE_DEBUG_LEVEL=1

